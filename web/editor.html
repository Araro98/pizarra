<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor · Pizarra</title>
<link rel="icon" type="image/png" href="/ui/pizarra-icono-64">
<style>
  /* Calcado del juego a partir de las capturas de Aaron. Sin tipografias ni nada
     de internet: esto funciona con el ordenador desconectado. Las bandas de
     rareza y las caras son ficheros del propio juego. */
  :root {
    --azul-fondo:#e8f1fb; --azul-hueco:#cfe3f6; --azul-marco:#2b5ea8;
    --azul-osc:#1b4a8f; --naranja:#f08a1c; --naranja-claro:#f9b24a;
    --tinta:#12233b; --suave:#5d7590; --linea:#b9d3ec; --papel:#ffffff;
    --cian:#3fe0d0;
  /* la escala de letra: nueve tamanos y ninguno mas (NOTAS O-151) */
  --t-xxs:9px;   --t-xs:10px;   --t-sm:11.5px;
  --t-md:13px;   --t-base:15px;   --t-lg:17px;
  --t-xl:20px;   --t-2xl:24px;   --t-3xl:30px;
  --panel:#1b2f5c; --panel-claro:#27407a; --aro:#9fb6d6;
  }
  * { box-sizing:border-box; }
  /* El fondo del juego no es un color plano: es un campo azul con luz
     diagonal, rayas finas y un balon enorme de marca de agua. Aqui se monta
     con la misma imagen de balon que usa el (datos/ui/balon-grande.png). */
  /* Desde la ronda O-147 el fondo es el del menu de inicio: claro, con la
     trama de hexagonos del juego, y las cajas azul marino con borde blanco. */
  body { margin:0; color:var(--tinta);
    font:var(--t-base)/1.45 system-ui,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='146' viewBox='0 0 84 146'><path d='M42 2 80 24v44L42 90 4 68V24z M42 75 80 97v44L42 163 4 141V97z' fill='none' stroke='rgba(30,60,110,.13)' stroke-width='2'/><path d='M-38 75 0 97v44l-38 22 M84 75l38 22v44l-38 22' fill='none' stroke='rgba(30,60,110,.13)' stroke-width='2'/></svg>") 0 0 / 84px 146px,
      linear-gradient(180deg,#f4f8fd 0%,#e4edf8 100%);
    background-attachment:fixed; }
  body::before { content:""; position:fixed; inset:0; z-index:-1;
    pointer-events:none;
    background:url("/ui/balon-grande") no-repeat right -120px bottom -90px;
    background-size:560px auto; opacity:.10; }
  body::after { content:none; }
  button, select, input { font:inherit; color:inherit; }
  .titulo { font-weight:800; font-style:italic; }

  .barra-modos { background:rgba(244,248,253,.94); backdrop-filter:blur(4px);
    border-bottom:2px solid var(--aro);
    padding:12px 16px 10px; display:flex; gap:12px; overflow-x:auto;
    position:sticky; top:0; z-index:30; }
  .rombo { transform:skewX(-8deg); border:2px solid #fff; border-radius:6px;
    box-shadow:0 0 0 2px var(--aro), 0 5px 10px rgba(15,40,90,.22);
    background:var(--panel); min-width:112px; height:54px; text-decoration:none;
    cursor:pointer; flex:none; color:#fff; transition:transform .1s, background .1s; }
  .rombo > span { transform:skewX(8deg); display:flex; height:100%;
    align-items:center; justify-content:center; gap:6px; font-weight:800;
    font-size:var(--t-sm); letter-spacing:.05em; text-transform:uppercase; padding:0 10px; }
  .rombo:hover { background:var(--panel-claro); transform:skewX(-8deg) translateY(-2px); }
  .rombo[aria-selected="true"] { background:#fff; color:var(--panel);
    box-shadow:0 0 0 2px var(--cian), 0 5px 10px rgba(15,40,90,.22); }
  .rombo.inicio { min-width:86px; }
  .rombo.inicio img { width:22px; height:22px; }
  .modal.pregunta { width:min(430px,100%); }
  .modal .pie .btn + .btn { margin-left:8px; }
  .numero-grande { width:140px; font-size:var(--t-xl); font-weight:800; text-align:center;
    padding:6px 8px; border:2px solid var(--azul-marco); border-radius:8px; }
  /* La banda del titulo es la propia del juego (cmn03_06), estirada a lo
     ancho, con el balon pegado a la izquierda igual que ahi. */
  .rotulo-modo { color:#fff; padding:9px 22px 9px 58px; display:flex;
    align-items:center; gap:12px; font-size:var(--t-xl); flex-wrap:wrap;
    position:relative; overflow:hidden;
    background:url("/ui/franja-azul") left center/100% 100% no-repeat;
    text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .rotulo-modo::before { content:""; position:absolute; left:6px; top:50%;
    width:44px; height:44px; transform:translateY(-50%);
    background:url("/ui/balon") center/contain no-repeat; opacity:.9; }
  .rotulo-modo::after { content:""; position:absolute; left:0; right:0; bottom:0;
    height:4px; background:linear-gradient(90deg,var(--cian),rgba(63,224,208,0)); }
  .rotulo-modo .pista { font-size:var(--t-sm); font-style:normal; font-weight:600; opacity:.85; }
  .acciones { margin-left:auto; display:flex; gap:8px; align-items:center; }
  /* Los botones del juego son romboides: el lado se corta en diagonal.
     El fondo va en una capa de detras inclinada, para que el ROTULO siga
     derecho; inclinar el boton entero torcia tambien las letras. */
  .btn { border:none; background:none; color:#fff; padding:7px 18px;
    cursor:pointer; font-weight:800; font-size:var(--t-md); font-style:italic;
    position:relative; isolation:isolate; text-shadow:0 1px 2px rgba(0,0,0,.55);
    transition:transform .06s, filter .1s; }
  .btn::before { content:""; position:absolute; inset:0; z-index:-1;
    transform:skewX(-11deg); border:2px solid #fff; border-radius:5px;
    background:linear-gradient(180deg,#2c4886,#1b2f5c);
    box-shadow:0 0 0 2px var(--aro), 0 3px 0 rgba(8,28,60,.4),
               inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.verde::before { background:linear-gradient(180deg,#48dd8a,#14804a);
    border-color:#0f5f37; }

  .btn:active:not(:disabled) { transform:translateY(3px); }
  .btn:active:not(:disabled)::before { box-shadow:none; }
  .btn:hover:not(:disabled) { filter:brightness(1.15)
    drop-shadow(0 0 5px rgba(63,224,208,.5)); }
  .btn:disabled { opacity:.45; cursor:not-allowed; filter:grayscale(.5); }
  .pendientes { background:#fff3cd; border:2px solid #e0a800; color:#8a5a00;
    border-radius:999px; padding:2px 12px; font-size:var(--t-md); font-weight:700; }

  main { padding:16px; }
  .oculto { display:none !important; }
  .dos { display:grid; gap:14px; align-items:start;
    grid-template-columns:minmax(280px,.8fr) minmax(520px,1.4fr); }
  @media (max-width:1100px) { .dos { grid-template-columns:1fr; } }

  .marco { background:#fff; border:3px solid #fff; border-radius:9px; padding:12px;
    position:relative;
    box-shadow:0 0 0 2px var(--aro), 0 8px 18px rgba(20,55,105,.16); }
  .marco > h2 { margin:-4px -4px 10px; font-size:var(--t-md); color:#fff;
    text-transform:uppercase; letter-spacing:.08em; font-weight:800;
    font-style:italic; padding:8px 12px 8px 40px; position:relative;
    border-radius:8px; overflow:hidden;
    background:url("/ui/franja-cian") left center/100% 100% no-repeat;
    text-shadow:0 1px 2px rgba(0,40,80,.55); }
  .marco > h2::before { content:""; position:absolute; left:6px; top:50%;
    width:28px; height:28px; transform:translateY(-50%);
    background:url("/ui/balon-oscuro") center/contain no-repeat; opacity:.75; }
  /* La caja de buscar del juego es una pastilla con lupa a la izquierda que
     se enciende en cian al escribir. */
  .buscador input, .barra-mochila input, .modal .busca input {
    border:2px solid #9dbfe2; border-radius:999px; background:#fff
      url("/ui/lupa") 12px center/18px auto no-repeat;
    padding:8px 14px 8px 38px; box-shadow:inset 0 2px 4px rgba(20,55,105,.12);
    outline:none; transition:border-color .12s, box-shadow .12s; }
  .buscador input:focus, .barra-mochila input:focus, .modal .busca input:focus {
    border-color:var(--cian);
    box-shadow:0 0 0 3px rgba(63,224,208,.35), inset 0 2px 4px rgba(20,55,105,.1); }
  .buscador input { width:100%; max-width:440px; margin-bottom:10px; }
  .filtros { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;
    margin-bottom:10px; }
  .filtro { display:flex; flex-direction:column; gap:2px; }
  .filtro span { font-size:var(--t-xs); font-weight:800; color:var(--azul-osc);
    text-transform:uppercase; letter-spacing:.05em; }
  .filtro select { padding:5px 8px; border-radius:6px; border:2px solid var(--azul-marco);
    background:#fff; max-width:190px; }
  .contador button { padding:2px 10px; }
  .rejilla-jug { display:grid; gap:8px; max-height:64vh; overflow:auto;
    grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); }
  .ficha-mini { position:relative; border:2px solid #16365f; border-radius:8px;
    overflow:hidden; cursor:pointer; padding:0; aspect-ratio:1/1; display:block;
    box-shadow:0 3px 0 rgba(8,28,60,.45), inset 0 2px 0 rgba(255,255,255,.35);
    transition:transform .1s, box-shadow .1s, filter .1s; }
  .ficha-mini:hover { transform:translateY(-3px) scale(1.03);
    box-shadow:0 6px 10px rgba(8,28,60,.35), 0 0 0 2px var(--cian);
    filter:saturate(1.15) brightness(1.06); z-index:2; }
  .ficha-mini > img { position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; }
  /* La trama de puntos es la del juego (menu/101_member). Va encima del color
     de la rareza y debajo de la cara, que es como lo monta el. */
  /* Rayas diagonales, las mismas que la franja de la ficha. La trama de puntos
     que traia el juego quedaba sucia a este tamano. */
  .ficha-mini::before { content:""; position:absolute; inset:0; z-index:0;
    background-image:repeating-linear-gradient(135deg,
      rgba(255,255,255,.17) 0 7px, rgba(255,255,255,0) 7px 15px);
    box-shadow:inset 0 -22px 26px -18px rgba(0,0,0,.45),
               inset 0 14px 18px -14px rgba(255,255,255,.35); }
  .ficha-mini > img, .ficha-mini > .nv, .ficha-mini > .abajo,
  .ficha-mini > .nombre-mini { z-index:1; }
  .ficha-mini .nv { position:absolute; left:4px; top:1px; color:#fff;
    font-weight:800; font-style:italic; font-size:var(--t-xl); line-height:1.1;
    text-shadow:0 0 3px #000,1px 1px 0 #000,-1px 1px 0 #000; }
  .ficha-mini .nv small { font-size:var(--t-xs); }
  .ficha-mini .abajo { position:absolute; left:3px; bottom:3px; display:flex;
    gap:4px; align-items:center; }
  .elem { width:21px; height:21px; border-radius:5px; display:inline-block;
    flex:none; position:relative; overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  .elem img { position:absolute; inset:0; width:100%; height:100%; }
  .pos { font-weight:800; font-style:italic; font-size:var(--t-sm); color:#fff;
    text-shadow:0 0 2px #000,1px 1px 0 #000; }
  .nombre-mini { position:absolute; left:0; right:0; top:50%;
    transform:translateY(-50%); color:#fff; font-size:var(--t-sm); font-weight:800;
    text-align:center; padding:2px 4px; line-height:1.2;
    text-shadow:0 0 4px #000,1px 1px 0 #000,-1px 1px 0 #000; }
  .poder { position:absolute; right:4px; bottom:3px; z-index:1; color:#fff;
    font-weight:800; font-style:italic; font-size:var(--t-sm);
    text-shadow:0 0 3px #000,1px 1px 0 #000; }
  .ficha-mini[aria-current="true"] { outline:3px solid var(--cian);
    outline-offset:-3px; box-shadow:0 0 0 3px rgba(63,224,208,.35),
    0 4px 10px rgba(10,40,80,.4); }
  /* El fogonazo que el juego pone detras de lo seleccionado. */
  .ficha-mini[aria-current="true"]::after { content:""; position:absolute;
    inset:-30%; z-index:0; pointer-events:none; mix-blend-mode:screen;
    background:url("/ui/destello") center/contain no-repeat; opacity:.55;
    animation:latir 2.4s ease-in-out infinite; }
  @keyframes latir { 0%,100% { opacity:.38; transform:scale(.96); }
                     50%     { opacity:.62; transform:scale(1.04); } }
  @media (prefers-reduced-motion:reduce) {
    .ficha-mini[aria-current="true"]::after { animation:none; } }
  .contador { margin-top:8px; font-size:var(--t-md); color:var(--azul-osc);
    font-weight:700; display:flex; gap:14px; }

  .ficha { animation:asomar .16s ease-out;
    background:var(--papel); border:2px solid var(--azul-marco);
    border-radius:14px; overflow:hidden;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),
               0 4px 0 rgba(20,55,105,.3), 0 10px 22px rgba(20,55,105,.2); }
  .cabecera { background:linear-gradient(180deg,var(--naranja-claro),var(--naranja));
    display:flex; gap:14px; align-items:center; padding:8px 14px; position:relative; }
  .cabecera::after { content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(135deg,rgba(255,255,255,.14) 25%,transparent 25%,
      transparent 50%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.14) 75%,transparent 75%);
    background-size:16px 16px; }
  .cabecera .retrato { width:84px; height:84px; border-radius:6px; overflow:hidden;
    background:rgba(255,255,255,.35); flex:none; position:relative; z-index:1; }
  .cabecera .retrato { position:relative; }
  .cabecera .retrato img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cabecera .datos { flex:1; min-width:0; position:relative; z-index:1; }
  .cabecera h3 { margin:0; font-size:var(--t-xl); color:#fff; font-weight:800;
    text-shadow:2px 2px 0 rgba(0,0,0,.35); }
  .chips { display:flex; gap:8px; align-items:center; margin-top:5px; flex-wrap:wrap; }
  .banda { height:24px; }
  .nivel-grande { position:relative; z-index:1; color:#fff; text-align:right;
    font-weight:800; font-style:italic; text-shadow:2px 2px 0 rgba(0,0,0,.3); }
  .nivel-grande b { font-size:var(--t-3xl); line-height:1; display:block; }
  .nivel-grande small { font-size:var(--t-sm); font-style:normal; font-weight:700; }
  .descripcion { background:#eaf6ff; border-bottom:1px solid #cfe6fa;
    padding:10px 16px; color:#24405f; font-size:var(--t-md); line-height:1.5; }
  .sub-datos { background:#f4f9fe; border-bottom:2px solid #cfe6fa;
    padding:6px 16px; color:#5d7590; font-size:var(--t-sm); font-weight:600; }

  .seccion-nav { display:flex; align-items:center; gap:10px;
    margin:10px 14px 2px; padding:4px 8px; border-radius:8px; overflow:hidden;
    background:url("/ui/franja-cian") center/100% 100% no-repeat;
    box-shadow:0 2px 0 rgba(20,55,105,.25), inset 0 1px 0 rgba(255,255,255,.4); }
  .seccion-nav h4 { color:#fff !important;
    text-shadow:0 2px 2px rgba(0,50,90,.65) !important; }
  /* Las flechas verdes son las del juego (cmn05_01). La de la izquierda es
     la misma imagen del reves. */
  .seccion-nav button { border:none; background:none; cursor:pointer;
    font-size:0; padding:0; width:30px; height:30px; flex:none;
    background:url("/ui/flecha") center/24px auto no-repeat;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3)); transition:transform .1s; }
  .seccion-nav button.izq { transform:scaleX(-1); }
  .seccion-nav button:hover { filter:drop-shadow(0 0 4px rgba(63,224,208,.9))
    brightness(1.1); }
  .seccion-nav button:active { transform:scale(.88); }
  .seccion-nav button.izq:active { transform:scaleX(-1) scale(.88); }
  .seccion-nav h4 { margin:0; font-size:var(--t-xl); color:var(--azul-osc);
    font-weight:800; font-style:italic; text-transform:uppercase;
    letter-spacing:.04em; flex:1; text-align:center;
    text-shadow:0 1px 0 rgba(255,255,255,.9); }
  .puntos { display:flex; gap:6px; justify-content:center; padding:6px 0 12px; }
  .puntos i { width:8px; height:8px; border-radius:50%; background:#c3d6e8; }
  .puntos i.on { background:var(--azul-marco); }
  .panel-seccion { padding:4px 14px 6px; }

  /* Colocacion calcada del juego: Potencia arriba, Tecnica y Control a los
     lados, Inteligencia y Presion debajo, Agilidad y Fisico abajo, y la
     telarana en el centro. */
  .cuerpo-ficha { display:grid; grid-template-columns:250px minmax(0,1fr); gap:12px;
    padding:6px 14px 6px; align-items:start; }
  @media (max-width:820px) { .cuerpo-ficha { grid-template-columns:1fr; } }
  .lado-derecho { min-width:0; }
  .stats { border-radius:12px; border:2px solid #0d2f66;
    background:
      url("/ui/balon-grande") no-repeat right -26px bottom -18px,
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%),
      linear-gradient(180deg,#2a6ec6,#0f356f);
    background-size:150px auto, auto, auto; background-blend-mode:soft-light,normal,normal;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.25), 0 4px 0 rgba(10,35,75,.45);
    padding:12px 8px; display:grid; gap:2px; position:relative; overflow:hidden;
    grid-template-columns:1fr 1.15fr 1fr;
    grid-template-areas:"a a a" "i1 tela d1" "i2 tela d2" "ai tela ad" "n n n"; }
  .stat.arriba { grid-area:a; } .stat.izq1 { grid-area:i1; }
  .stat.der1 { grid-area:d1; } .stat.izq2 { grid-area:i2; }
  .stat.der2 { grid-area:d2; } .stat.abajo-izq { grid-area:ai; }
  .stat.abajo-der { grid-area:ad; }
  .telarana { grid-area:tela; width:100%; align-self:center;
    filter:drop-shadow(0 0 6px rgba(63,224,208,.55)); }
  .stat { text-align:center; color:#fff; }
  .stat b { display:block; font-size:var(--t-xl); font-weight:800; font-style:italic;
    line-height:1; text-shadow:2px 2px 0 rgba(0,0,0,.3); }
  .stat.sube span { color:#8dff9c; }
  .stat span { font-size:var(--t-xs); font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; color:#bcd8f7; }
  .stat.sube b { color:#8dff9c; }
  .stat em { display:block; font-style:normal; font-size:var(--t-sm); font-weight:800;
    color:#8dff9c; line-height:1; }
  .stat u { display:block; font-size:var(--t-xs); color:#9fc4ea; text-decoration:none;
    font-style:normal; }
  .stats .nota { grid-area:n; text-align:center; font-size:var(--t-sm);
    color:#a8c8ea; margin-top:4px; }
  /* Flexible y con salto de linea: el panel de la derecha se estrecha segun la
     ventana, y con rejilla fija el texto de las pasivas quedaba en una columna
     de dos palabras. */
  /* En el juego cada ranura es una chapa con un filo de color a la izquierda
     y el numero dentro de un rombo. */
  .ranura { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    border-radius:9px; margin-bottom:7px; padding:7px 10px 7px 12px;
    position:relative; overflow:hidden;
    background:linear-gradient(180deg,#ffffff,#e9f2fc); border:1px solid #bcd6ee;
    box-shadow:0 2px 0 rgba(20,55,105,.16), inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .08s, box-shadow .08s, border-color .08s; }
  .ranura::before { content:""; position:absolute; left:0; top:0; bottom:0;
    width:5px; background:linear-gradient(180deg,#5aa8f0,#1c4fa4); }
  .ranura.heredada::before { background:linear-gradient(180deg,#7ad8ff,#1f8fe0); }
  .ranura:hover { border-color:var(--azul-marco); transform:translateX(2px);
    box-shadow:0 2px 0 rgba(20,55,105,.22), 0 0 0 2px rgba(63,224,208,.35); }
  .ranura .texto { flex:1 1 160px; min-width:0; }
  .ranura > button, .ranura > span.bloqueada { flex:0 0 auto; }
  .ranura:hover { border-color:var(--azul-marco); }
  /* `isolation:isolate` no es decorativo: sin el, el z-index -1 del fondo se
     va DETRAS de la ranura entera y el numero se queda en blanco sobre blanco. */
  .ranura .marca { width:30px; height:30px; flex:none; font-weight:800;
    color:#fff; font-size:var(--t-md); font-style:italic; position:relative;
    isolation:isolate; display:flex; align-items:center; justify-content:center; }
  .ranura .marca::before { content:""; position:absolute; inset:0; z-index:-1;
    transform:skewX(-11deg); border-radius:5px; border:2px solid #16457f;
    background:linear-gradient(180deg,#5c9cea,#1c4fa4);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35); }
  .ranura .texto { min-width:0; }
  .ranura .texto b { display:block; font-weight:700; }
  .ranura .texto span { font-size:var(--t-sm); color:var(--suave); }
  .ranura button.elegir { border:2px solid var(--azul-marco); background:#fff;
    border-radius:6px; padding:5px 12px; cursor:pointer; font-weight:700;
    font-size:var(--t-md); color:var(--azul-osc); white-space:nowrap; }
  .ranura button.elegir:hover { background:#e6f1fc; }
  .ranura.heredada { background:linear-gradient(90deg,#e9f2ff,#f9fcff);

  .barra .cuantos { text-align:right; font-weight:800;
    font-variant-numeric:tabular-nums; }
  .fondo-modal { position:fixed; inset:0; background:rgba(10,25,45,.55);

  .modal { background:#fff; border:3px solid var(--azul-marco); border-radius:12px;

  @media (prefers-reduced-motion:reduce) { .modal { animation:none; } }
  .modal .cab { color:#fff; padding:11px 14px 11px 52px; position:relative;

  .modal .cab::before { content:""; position:absolute; left:8px; top:50%;

    background:url("/ui/balon") center/contain no-repeat; }
  .modal .cab h3 { margin:0; font-size:var(--t-lg); font-weight:800; font-style:italic; }

  .modal .busca { padding:10px 14px; border-bottom:1px solid var(--linea); }
  .filtros-picker { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .filtros-picker select { padding:4px 8px; border-radius:6px; font-size:var(--t-sm);
    border:2px solid var(--azul-marco); background:#fff; max-width:180px; }
  .btn.chico { padding:4px 12px; font-size:var(--t-sm); }
  .modal li button { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .modal li button > span { flex:1 1 auto; }
  .mini-icono { width:30px; height:30px; object-fit:contain; flex:none; }

  .ico-stat { width:20px; height:20px; object-fit:contain; flex:none;

  /* Un campo que no se puede tocar (la rareza de un Idolo): antes salia en gris
     sobre el verde del campo y no se leia. Ahora va en una caja blanca como los
     demas campos, con el motivo en cursiva. */
  .campo .bloqueada { display:block; background:rgba(255,255,255,.92);
    color:#3a4a5c; border:2px solid var(--azul-marco); border-radius:8px;
    padding:8px 10px; font-size:var(--t-sm); font-style:italic; line-height:1.3; }
  .ico-pasiva { width:30px; height:30px; object-fit:contain; flex:none;
    background:linear-gradient(180deg,#5c9cea,#1c4fa4); border-radius:7px; padding:4px;
    box-shadow:0 1px 0 rgba(10,30,60,.3); }
  .modal li .mini-icono[src*="icon_abilearboard"] { background:linear-gradient(180deg,#5c9cea,#1c4fa4);
    border-radius:6px; padding:4px; }
  .ico-judia { width:34px; height:34px; object-fit:contain; flex:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.28)); }
  .mini-icono.grande { width:38px; height:38px; }
  .fam.fam-tec { background:linear-gradient(180deg,#5c9cea,#1c4fa4); color:#fff; }
  .ranura-tec { padding-right:10px; }
  .ranura-tec .tec-barra { flex:1 1 220px; min-width:0; }

  /* Una tecnica, con la pinta que tiene en el juego: el icono de su tipo a la
     izquierda, el nombre encima de la barra del color de su afinidad y el poder
     a la derecha. */
  .tec-barra { display:flex; align-items:center; gap:8px; width:100%;
    border-radius:7px; padding:5px 10px 5px 7px; color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 0 rgba(10,30,60,.25); }
  .tec-barra .nom { flex:1 1 auto; font-weight:800; font-style:italic;
    font-size:var(--t-md); text-shadow:0 1px 2px rgba(0,0,0,.45); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tec-barra .pot { flex:none; font-weight:800; font-style:italic; font-size:var(--t-xl);
    line-height:1; text-shadow:0 2px 2px rgba(0,0,0,.45); letter-spacing:-.02em; }
  .tec-barra .clase { flex:none; font-size:var(--t-xxs); font-weight:800; opacity:.9;
    text-transform:uppercase; letter-spacing:.06em; }
  .tec-barra .tp { flex:none; font-size:var(--t-xs); font-weight:700; opacity:.92; }
  .modal li button.con-barra { padding:5px 10px; }
  .modal li button.con-barra:hover { padding-left:14px; }
  /* Cuando lo que se elige son tecnicas, la ventana se ensancha: las barras del
     juego son largas y con 560 px los nombres se cortaban. */
  .modal.con-tecnicas { width:min(760px,100%); }
  .modal .busca input { width:100%; }
  .modal ul { list-style:none; margin:0; padding:0; overflow:auto; flex:1; }
  .modal li button { width:100%; text-align:left; background:none; border:none;
    padding:9px 14px; cursor:pointer; border-bottom:1px solid #eef3f8; }
  .modal li button { position:relative; transition:background .1s, padding .1s; }
  .modal li button:hover { background:linear-gradient(90deg,#d8ecff,#f4faff);
    padding-left:20px; box-shadow:inset 4px 0 0 var(--cian); }
  .modal li .extra { display:block; color:#17734b; font-size:var(--t-sm);
    font-weight:700; margin-top:1px; }
  .modal .pie { padding:9px 14px; border-top:1px solid var(--linea);
    display:flex; justify-content:space-between; align-items:center;
    font-size:var(--t-md); color:var(--suave); }

  /* El selector en rejilla (O-175): ancho, con tarjetas, para ver de un
     vistazo muchas opciones sin bajar y bajar. */
  .modal.selector { width:min(1200px,96vw); max-height:min(90vh,960px); }
  .modal.selector .herramientas { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 14px; border-bottom:1px solid var(--linea); background:#f6faff; }
  .modal.selector .herramientas input { flex:1 1 240px; min-width:160px; padding:7px 12px;
    border:2px solid var(--azul-marco); border-radius:8px; font-size:var(--t-md); }
  .modal.selector .herramientas .filtros-picker { margin:0; }
  .modal.selector .rejilla { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:8px; padding:10px 14px; overflow:auto; flex:1; align-content:start;
    background:linear-gradient(180deg,#eef4fb,#f7fafe); }
  .modal.selector .rejilla .vacio { grid-column:1/-1; }
  .opcion-tarjeta { position:relative; text-align:left; background:#fff; border:2px solid var(--linea);
    border-radius:10px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column;

    transition:transform .08s, box-shadow .08s, border-color .08s; }
  .opcion-tarjeta:hover, .opcion-tarjeta:focus-visible { border-color:var(--azul-marco); outline:none;
    box-shadow:0 3px 12px rgba(43,94,168,.28); transform:translateY(-1px); }
  .opcion-tarjeta.puesta { border-color:#18b7a6; background:linear-gradient(180deg,#effffc,#fff); }
  .opcion-tarjeta .ya { position:absolute; right:8px; top:-9px; background:#18b7a6; color:#fff;
    font-size:var(--t-xxs); font-weight:800; padding:1px 8px; border-radius:8px;
    text-transform:uppercase; letter-spacing:.05em; }
  .opcion-tarjeta .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:var(--t-xs); font-weight:700; padding:1px 8px; border-radius:9px;
    background:#e9f1fb; color:#2b4a72; border:1px solid #cfe0f3; white-space:nowrap;
    flex:none; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .chip.tipo { background:var(--azul-marco); color:#fff; border-color:var(--azul-marco); }
  .chip.dueno { background:#fff4d6; color:#7a5200; border-color:#f0d58a; }
  .chip.rango { color:#b8860b; background:#fff9e6; border-color:#f3e2a0; letter-spacing:.08em; }
  .opcion-tarjeta .desc { margin:0; font-size:var(--t-sm); color:var(--suave); line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .opcion-tarjeta .cab-esp, .opcion-tarjeta .cab-obj { display:flex; gap:9px; align-items:center; min-width:0; }
  .opcion-tarjeta .titulos { min-width:0; display:flex; flex-direction:column; gap:1px; }
  .opcion-tarjeta .titulos b { font-size:var(--t-md); font-style:italic; font-weight:800;
    overflow:hidden; text-overflow:ellipsis; }
  .opcion-tarjeta .titulos small { color:var(--suave); font-size:var(--t-xs); }
  .ico-esp { width:48px; height:48px; object-fit:contain; flex:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .opcion-tarjeta .sub { font-size:var(--t-xxs); text-transform:uppercase; letter-spacing:.08em;
    color:var(--suave); font-weight:800; margin-top:2px; }
  .opcion-tarjeta .stats { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:var(--t-sm);
    font-weight:700; color:#17734b; }
  .opcion-tarjeta .stats .stat { display:inline-flex; align-items:center; gap:2px; }
  .opcion-tarjeta .stats .total { color:#2b5ea8; }
  .opcion-tarjeta .extra { color:#17734b; font-size:var(--t-sm); font-weight:700; }
  .opcion-tarjeta .tec-barra .nom { white-space:normal; line-height:1.15; }
  .pasiva-esp { margin:0; font-size:var(--t-sm); font-weight:700; color:#17734b;
    background:#eefaf3; border:1px solid #bfe6d2; border-radius:7px; padding:4px 8px;
    line-height:1.25; }
  .pasiva-esp.grande { font-size:var(--t-md); }
  .btn.info, button.info { flex:none; width:26px; height:26px; border-radius:50%;
    border:2px solid var(--azul-marco); background:#fff; color:var(--azul-marco);
    font-weight:800; font-style:italic; cursor:pointer; line-height:1; padding:0; }
  button.info:hover { background:var(--azul-marco); color:#fff; }
  .modal.ficha-esp { width:min(560px,96vw); }
  .modal.ficha-esp .cuerpo { display:flex; gap:12px; padding:12px 14px; align-items:flex-start; }
  .modal.ficha-esp .datos { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .retrato-esp { width:110px; height:110px; object-fit:contain; flex:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  @media (max-width:700px) { .modal.selector .rejilla { grid-template-columns:1fr; } }

  .aviso { padding:9px 14px; border-radius:8px; font-size:var(--t-md); margin:0 0 10px;
    font-weight:600; }
  .aviso { padding-left:42px; background-repeat:no-repeat;
    background-position:12px center; background-size:20px auto; }
  .aviso.mal { background-color:#fde8e6; color:#a8202e; border:2px solid #f0b6b1;
    background-image:url("/ui/aviso"); }
  .aviso.bien { background:#e4f7ec; color:#17734b; border:2px solid #a9e3c3; }
  .vacio { color:var(--suave); padding:26px; text-align:center; }
  ol.cambios { margin:0; padding-left:20px; font-size:var(--t-md); }
  ol.cambios li { margin-bottom:4px; }
</style>

<body>

<nav class="barra-modos" id="modos" role="tablist"></nav>
<div class="rotulo-modo">
  <span class="titulo" id="rotulo">Jugadores</span>
  <span class="pista" id="ruta"></span>
  <span class="acciones">
    <span class="pendientes" id="pendientes" hidden></span>
    <button class="btn" id="abrir">Abrir partida...</button>
    <button class="btn" id="deshacer" disabled>Deshacer</button>
    <button class="btn verde" id="guardar" disabled>Guardar copia</button>
  </span>
</div>

<main>
  <div id="mensaje"></div>

  <section id="p-jugadores">
    <div class="dos">
      <div class="marco">
        <h2>Plantilla</h2>
        <div class="buscador"><input type="search" id="buscar"
          placeholder="Buscar por nombre, equipo, posicion..."></div>
        <div class="filtros" id="filtros"></div>
        <div id="bonif-jug"></div>
        <div class="rejilla-jug" id="lista"></div>
        <div class="contador" id="contador"></div>
      </div>
      <div class="ficha" id="ficha"><div class="vacio">Elige un jugador.</div></div>
    </div>
  </section>

  <section id="p-mochila" class="oculto">
    <div class="pestanas-obj" id="cat-obj"></div>
    <div class="caja-obj">
      <div class="barra-mochila">
        <input type="search" id="buscar-obj" placeholder="Buscar objeto...">
        <button class="btn" id="todo-1">Conseguir 1 de todo</button>
        <button class="btn verde" id="todo-99">Conseguir 99 de todo</button>
        <button class="btn verde" id="pers-99"
          title="Las 37 pasivas personalizadas del juego, 99 de cada una">Conseguir 99 pasivas personalizadas</button>
        <button class="btn verde" id="personal-99"
          title="Las pasivas de gerente y de entrenador, 99 de cada una">Conseguir 99 pasivas de personal</button>
      </div>
      <div class="filtros" id="filtros-obj"></div>
      <div class="rejilla-obj" id="lista-obj"></div>
    </div>
  </section>

  <section id="p-equipos" class="oculto">
    <div class="pestanas-obj" id="tabs-equipos"></div>
    <div class="dos-equipo">
      <div class="marco">
        <h2>Reservas</h2>
        <div class="buscador"><input type="search" id="buscar-res" placeholder="Buscar jugador..."></div>
        <div class="filtros" id="filtros-res"></div>
        <div class="rejilla-jug" id="lista-res"></div>
        <div class="contador" id="contador-res"></div>
      </div>
      <div id="ficha-equipo"></div>
    </div>
  </section>

  <section id="p-fichar" class="oculto">
    <div class="marco">
      <h2>Fichar un jugador</h2>
      <div class="pestanas-obj" id="familias-per"></div>
      <div class="buscador"><input type="search" id="buscar-per" placeholder="Buscar personaje..."></div>
      <div class="filtros" id="filtros-per"></div>
      <div class="rejilla-jug" id="lista-per"></div>
      <div class="contador" id="contador-per"></div>
    </div>
  </section>

  <section id="p-resumen" class="oculto">
    <div class="marco"><h2>Como esta tu partida</h2>
      <div id="cuerpo-resumen"></div></div>
  </section>

  <section id="p-cambios" class="oculto">
    <div class="marco"><h2>Lo que se va a escribir</h2>
      <div style="background:#fff;border-radius:8px;padding:12px" id="cuerpo-cambios"></div></div>
  </section>
</main>

<script src="/web/comun.js"></script>
<script>
let estado = {cambios:[], puede_deshacer:false}, jugadorAbierto = null;
let modo = "jugadores", seccion = 0, detalle = null, temporizador = null;

const MODOS = [
  {id:"jugadores", nombre:"Jugadores"},
  {id:"mochila",   nombre:"Mochila"},
  {id:"equipos",   nombre:"Equipos"},
  {id:"fichar",    nombre:"Fichar"},
  {id:"cambios",   nombre:"Cambios"},
  {id:"resumen",   nombre:"Resumen"},
];
const SECCIONES = ["Atributos", "Supertecnicas", "Equipacion", "Pasivas"];

// Sin afinidad: gris azulado. El morado se guarda para los espiritus, que es
// como los ensena el juego.






// Los colores de cada rareza NO estan puestos a ojo: son el color dominante de
// la banda de rareza del propio juego, sacado de su imagen (NOTAS O-89).
const FONDO_RAREZA = COLOR_RAREZA;

function aviso(texto, clase) {
  $("#mensaje").textContent = "";
  if (!texto) return;
  const p = el("p", {class:"aviso " + clase, text:texto});
  $("#mensaje").appendChild(p);
  if (clase === "bien") setTimeout(() => p.remove(), 5000);
}
// los avisos de las piezas compartidas (comun.js) salen con el aviso del editor
avisa = (texto, clase) => aviso(texto, clase);

function pintaModos() {
  const n = $("#modos"); n.textContent = "";
  n.appendChild(el("a", {class:"rombo inicio", href:"/", title:"Volver al menu de inicio"}, [
    el("span", {}, [el("img", {src:"/icono/icon_list_tab/icon_list_tab_town01.png", alt:""}),
                    document.createTextNode("Inicio")])]));
  for (const m of MODOS)
    n.appendChild(el("button", {class:"rombo", role:"tab",
      "aria-selected":String(modo === m.id), onclick:() => cambiaModo(m.id)},
      [el("span", {text:m.nombre})]));
  $("#rotulo").textContent = MODOS.find(m => m.id === modo).nombre;
}
function cambiaModo(id) {
  modo = id; pintaModos();
  history.replaceState(null, "", "#" + id);   // para poder enlazar cada pestana
  for (const m of MODOS) $("#p-" + m.id).classList.toggle("oculto", m.id !== id);
  if (id === "jugadores") cargaLista();   // por si se ficho o se borro alguien
  if (id === "mochila") cargaInventario();
  if (id === "equipos") cargaEquipos();
  if (id === "fichar") cargaPersonajes();
  if (id === "cambios") pintaCambios();
  if (id === "resumen") pintaResumen();
}

async function refrescaEstado() {
  estado = await pedir("/api/estado");
  $("#ruta").textContent = estado.origen;
  const n = estado.cambios.length;
  $("#pendientes").hidden = !n;
  $("#pendientes").textContent = n + (n === 1 ? " cambio" : " cambios") + " sin guardar";
  $("#deshacer").disabled = !estado.puede_deshacer;
  $("#guardar").disabled = !n;
}
function pintaCambios() {
  const c = $("#cuerpo-cambios"); c.textContent = "";
  if (!estado.cambios.length)
    return c.appendChild(el("p", {class:"vacio", text:"Todavia no has cambiado nada."}));
  const ol = el("ol", {class:"cambios"});
  for (const x of estado.cambios) {
    const partes = [];
    for (const [k, v] of Object.entries(x)) {
      if (typeof v === "object" || k.endsWith("_off") || v === "") continue;
      partes.push(k + ": " + v);
    }
    ol.appendChild(el("li", {text:partes.join("  ·  ")}));
  }
  c.appendChild(ol);
}

/* ---- lista de jugadores: filtros, orden y paginas ---- */
const CAMPOS_FILTRO = [["elemento","Afinidad"],["posicion","Posicion"],
  ["rareza","Rareza"],["arquetipo","Arquetipo"],["equipo","Equipo"],
  // "Mi equipo" son los equipos guardados de Aaron, con su cuerpo tecnico;
  // "Equipo" a secas es el equipo del personaje en la historia (NOTAS O-181)
  ["mi_equipo","Mi equipo"],
  // Estos cuatro no vienen del personaje sino de COMO esta el jugador, que es
  // lo que hace falta para buscar "a quien le queda algo por terminar".
  ["nivel_grupo","Nivel"],["judias","Judias"],["heredadas","Heredadas"],
  ["equipacion","Equipacion"],["cuerpo_tipo","Cuerpo"]];
let filtros = {}, orden = "nivel", sentido = "asc", desde = 0, porPagina = 120, ultima = null;

function recuerda() {
  try { localStorage.setItem("ievr", JSON.stringify({filtros, orden, sentido, porPagina})); }
  catch (e) {}
}
function recupera() {
  try {
    const d = JSON.parse(localStorage.getItem("ievr") || "{}");
    if (d.filtros) filtros = d.filtros;
    if (d.orden) orden = d.orden;
    if (d.sentido) sentido = d.sentido;
    if (d.porPagina) porPagina = d.porPagina;
  } catch (e) {}
}

function trabajando(si) { document.body.style.cursor = si ? "progress" : ""; }

async function cargaLista() {
  const p = new URLSearchParams({q:$("#buscar").value.trim(), orden, sentido,
    desde:String(desde), cuantos:String(porPagina)});
  for (const [c] of CAMPOS_FILTRO) if (filtros[c]) p.set(c, filtros[c]);
  trabajando(true);
  try { ultima = await pedir("/api/jugadores?" + p); }
  finally { trabajando(false); }
  pintaFiltros(ultima);
  // Si se esta mirando un equipo mio, la suma de sus pasivas sale aqui mismo,
  // que es lo que pidio Aaron para plantear pasivas sin cambiar de pestana
  // (NOTAS O-183).
  const panel = $("#bonif-jug"); panel.textContent = "";
  if (filtros.mi_equipo) {
    const opc = (ultima.filtros.mi_equipo || []).find(o => o.valor === filtros.mi_equipo);
    if (opc && opc.hueco !== undefined)
      panel.appendChild(panelBonificaciones(opc.hueco));
  }
  const r = $("#lista"); r.textContent = "";
  for (const j of ultima.jugadores) r.appendChild(fichaMini(j));
  if (!ultima.jugadores.length)
    r.appendChild(el("div", {class:"vacio", text:"Ningun jugador encaja con esos filtros."}));
  pintaPaginas(ultima);
}



function fichaMini(j) {
  const t = el("button", {class:"ficha-mini",
    "aria-current":String(jugadorAbierto === j.fila),
    title:j.nombre + " — " + j.rareza + (j.equipo ? " — " + j.equipo : ""),
    onclick:() => abreJugador(j.fila)});
  t.style.background = FONDO_RAREZA[j.rareza_valor] || "#5d7590";
  if (j.cara) for (const c of capasRetrato(j, true)) t.appendChild(c);
  t.appendChild(el("div", {class:"nv", html:"<small>Nv.</small> " + j.nivel}));
  if (((modo === "equipos" ? ordenRes : orden) === "llegada") && j.serie)
    t.appendChild(el("div", {class:"serie-mini", text:"nº " + j.serie,
                            title:"Numero de llegada: cuanto mas bajo, antes llego a la partida"}));
  const abajo = el("div", {class:"abajo"});
  if (j.elemento) abajo.appendChild(iconoElemento(j.elemento));
  if (j.posicion) {
    const pp = el("span", {class:"pos", text:j.posicion});
    pp.style.color = COLOR_POS[j.posicion] || "#fff";
    abajo.appendChild(pp);
  }
  if (j.poder) t.appendChild(el("div", {class:"poder", text:String(j.poder),
    title:"Suma de los siete stats base"}));
  if (j.rol && j.rol !== "jugador")
    t.appendChild(el("span", {class:"chapa-rol " + j.rol,
      text:j.rol === "entrenador" ? "ENT" : "GER",
      title:j.rol === "entrenador" ? "Lleva la Medalla de entrenador: no juega"
                                   : "Lleva la Medalla de gerente: no juega"}));
  t.appendChild(abajo);
  return t;
}

function pintaFiltros(d) {
  const caja = $("#filtros");
  if (caja.dataset.listo === "si") return actualizaFiltros(d);
  caja.textContent = "";
  for (const [campo, etiqueta] of CAMPOS_FILTRO) {
    const sel = el("select", {id:"f-" + campo, onchange:e => {
      filtros[campo] = e.target.value; desde = 0; recuerda(); cargaLista(); }});
    caja.appendChild(el("label", {class:"filtro"},
      [el("span", {text:etiqueta}), sel]));
  }
  const so = el("select", {id:"f-orden", onchange:e => {
    orden = e.target.value; desde = 0; recuerda(); cargaLista(); }});
  // "llegada": el orden en que fueron llegando a la partida (lo pidio Aaron)
  const NOMBRE_ORDEN = {llegada:"Por orden de llegada"};
  for (const o of ["nivel","poder","nombre","rareza","equipo","fila","llegada"])
    so.appendChild(el("option", {value:o, text:NOMBRE_ORDEN[o] || ("Por " + o), selected:orden === o}));
  caja.appendChild(el("label", {class:"filtro"}, [el("span", {text:"Orden"}), so]));
  const ss = el("select", {id:"f-sentido", onchange:e => {
    sentido = e.target.value; desde = 0; recuerda(); cargaLista(); }});
  const SENTIDOS = orden === "llegada"
    ? [["asc","Los primeros que llegaron"],["desc","Los ultimos que llegaron"]]
    : [["asc","Normal"],["desc","Al reves"]];
  for (const [v, t] of SENTIDOS) ss.appendChild(el("option", {value:v, text:t, selected:sentido === v}));
  caja.appendChild(el("label", {class:"filtro"}, [el("span", {text:"Sentido"}), ss]));

  const sp = el("select", {id:"f-pag", onchange:e => {
    porPagina = Number(e.target.value); desde = 0; recuerda(); cargaLista(); }});
  for (const n of [60,120,300,600,0])
    sp.appendChild(el("option", {value:String(n), text:n ? n + " por pagina" : "Todos",
      selected:porPagina === n}));
  caja.appendChild(el("label", {class:"filtro"}, [el("span", {text:"Cuantos"}), sp]));

  caja.appendChild(el("button", {class:"btn", text:"Limpiar filtros", onclick:() => {
    filtros = {}; $("#buscar").value = ""; desde = 0; recuerda();
    caja.dataset.listo = ""; cargaLista(); }}));
  caja.dataset.listo = "si";
  actualizaFiltros(d);
}
function actualizaFiltros(d) {
  for (const [campo, etiqueta] of CAMPOS_FILTRO) {
    const sel = $("#f-" + campo);
    if (!sel) continue;
    const antes = filtros[campo] || "";
    sel.textContent = "";
    sel.appendChild(el("option", {value:"", text:"Todos"}));
    for (const o of d.filtros[campo] || [])
      sel.appendChild(el("option", {value:o.valor,
        text:o.valor + "  (" + o.cuantos + ")", selected:o.valor === antes}));
    sel.value = antes;
  }
}
function pintaPaginas(d) {
  const c = $("#contador"); c.textContent = "";
  const hasta = Math.min(d.desde + (porPagina || d.encajan), d.encajan);
  c.appendChild(el("span", {text:"Plantilla: " + d.total}));
  c.appendChild(el("span", {text:"Encajan: " + d.encajan}));
  if (porPagina) {
    c.appendChild(el("span", {text:"Viendo " + (d.encajan ? d.desde + 1 : 0) +
      "–" + hasta}));
    c.appendChild(el("button", {class:"btn", text:"◀", disabled:d.desde <= 0,
      onclick:() => { desde = Math.max(0, desde - porPagina); cargaLista(); }}));
    c.appendChild(el("button", {class:"btn", text:"▶", disabled:hasta >= d.encajan,
      onclick:() => { desde = desde + porPagina; cargaLista(); }}));
  }
}

function pintaFicha() {

  if (d.posicion) {

    s.style.color = COLOR_POS[d.posicion] || "#fff";
    s.style.fontSize = "15px";

  }

    src:"/rareza/" + d.rareza_valor});
  banda.onerror = () => banda.replaceWith(el("span", {class:"pos", text:d.rareza}));
  chips.appendChild(banda);

  // La franja de arriba lleva el color de SU rareza, no siempre naranja: en el
  // juego un comun sale verde y un Idolo rojo. El color sale de la propia banda
  // de rareza del juego (NOTAS O-89).
  const cab = el("div", {class:"cabecera"}, [retrato,
    el("div", {class:"datos"}, [el("h3", {text:d.nombre}), chips]),
    el("div", {class:"nivel-grande"}, [el("small", {text:"Nv."}),
      el("b", {text:String(d.nivel)})])]);
  cab.style.background = "linear-gradient(180deg," + aclara(color, .3) + "," + color + ")";
  p.appendChild(cab);

  if (d.descripcion)
    p.appendChild(el("div", {class:"descripcion", text:d.descripcion}));
  p.appendChild(el("div", {class:"sub-datos",
    text:[d.equipo, "Arquetipo " + d.arquetipo, "Fila " + d.fila]
          .filter(Boolean).join("   ·   ")}));

  p.appendChild(el("div", {class:"seccion-nav"}, [
    el("button", {class:"izq", text:"", title:"Anterior", onclick:() => {
      seccion = (seccion + SECCIONES.length - 1) % SECCIONES.length; pintaFicha(); }}),
    el("h4", {text:SECCIONES[seccion]}),
    el("button", {text:"", title:"Siguiente", onclick:() => {
      seccion = (seccion + 1) % SECCIONES.length; pintaFicha(); }})]));

  // Como en el juego: los stats SIEMPRE a la izquierda, y a la derecha lo de la
  // seccion que toque.
  const derecha = el("div", {class:"lado-derecho"});
  if (seccion === 0) derecha.appendChild(seccionAtributos(d));
  if (seccion === 1) derecha.appendChild(seccionTecnicas(d));
  if (seccion === 2) derecha.appendChild(seccionEquipacion(d));
  if (seccion === 3) derecha.appendChild(seccionPasivas(d));
  p.appendChild(el("div", {class:"cuerpo-ficha"}, [panelStats(d), derecha]));

  const puntos = el("div", {class:"puntos"});
  SECCIONES.forEach((_, i) => puntos.appendChild(el("i", {class:i === seccion ? "on" : ""})));
  p.appendChild(puntos);
}

function aclara(hex, cuanto) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) + Math.round(255 * cuanto));
  const g = Math.min(255, ((n >> 8) & 255) + Math.round(255 * cuanto));
  const b = Math.min(255, (n & 255) + Math.round(255 * cuanto));
  return "rgb(" + r + "," + g + "," + b + ")";
}

/* El panel de stats, con la misma colocacion que el juego: Potencia arriba,
   Tecnica y Control a los lados, Inteligencia y Presion debajo, Agilidad y
   Fisico abajo, y la telarana en medio. */
const SITIOS = [
  {i:0, clase:"arriba"},      // Potencia
  {i:2, clase:"izq1"},        // Tecnica
  {i:1, clase:"der1"},        // Control
  {i:6, clase:"izq2"},        // Inteligencia
  {i:3, clase:"der2"},        // Presion
  {i:5, clase:"abajo-izq"},   // Agilidad
  {i:4, clase:"abajo-der"},   // Fisico
];

function panelStats(d) {
  // Igual que el juego: cuando estas en judias o en equipacion, se ve en verde
  // lo que esa parte esta sumando a cada stat.
  const resalta = seccion === 0 ? "judias" : (seccion === 2 ? "equipacion" : null);
  const s = d.stats;
  if (!s || !s.hay)
    return el("div", {class:"stats"}, [el("div", {class:"nota",
      text:(s && s.motivo) || "Sin stats para este personaje"})]);
  const caja = el("div", {class:"stats"});
  for (const sitio of SITIOS) {
    const i = sitio.i;
    const partes = [];
    if (s.judias[i]) partes.push("judias +" + s.judias[i]);
    if (s.equipacion[i]) partes.push("equipo +" + s.equipacion[i]);
    if (s.arbol && s.arbol[i]) partes.push("arbol +" + s.arbol[i]);
    const aporta = resalta ? s[resalta][i] : 0;
    caja.appendChild(el("div", {class:"stat " + sitio.clase +
        (aporta ? " sube" : "")}, [
      aporta ? el("em", {text:"▲ +" + aporta}) : null,
      el("b", {text:String(s.total[i])}),
      el("span", {}, [iconoStat(s.nombres[i], 16, 2), document.createTextNode(s.nombres[i])]),
      partes.length ? el("u", {text:partes.join(" ")}) : null]));
  }
  caja.appendChild(telarana(s.total));
  // Se dice lo que ES. Para los futbolistas normales la cuenta esta entera
  // (base x rareza + arbol + judias + equipacion, NOTAS O-140); a Idolos y
  // Diamantes les falta el arbol, que llevan un tablero propio sin descifrar.
  caja.appendChild(el("div", {class:"nota", text:
    (s.exacto ? "Base del juego x rareza + arbol + judias + equipacion."
              : "Aproximado al nivel " + s.nivel + " (exacto a 1, 30, 50 y 99).") +
    (s.arbol_sabido ? "" : " A los Idolos y Diamantes les falta lo del arbol de "
      + "habilidades (unos 20-50 puntos), que tienen tablero propio.")}));
  return caja;
}

function telarana(valores) {
  // Ojo con la escala: antes se dibujaba dividiendo por el stat mas alto DEL
  // PROPIO jugador, asi que a todo el mundo le salia casi el mismo heptagono y
  // la figura no decia nada. Ahora la escala es fija (TOPE_TELA), que es mas o
  // menos el techo que se alcanza a nivel 99 con rareza maxima, judias y
  // equipacion; asi dos jugadores distintos dan figuras distintas.
  const NS = "http://www.w3.org/2000/svg";
  const lado = 170, c = lado / 2, radio = c - 16;
  const TOPE_TELA = 260;
  const tope = Math.max(TOPE_TELA, ...valores);
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + lado + " " + lado);
  svg.setAttribute("class", "telarana");
  const crea = (t, atributos) => {
    const e = document.createElementNS(NS, t);
    for (const k in atributos) e.setAttribute(k, atributos[k]);
    svg.appendChild(e);
    return e;
  };
  const punto = (k, f) => {
    const a = -Math.PI / 2 + k * 2 * Math.PI / 7;
    return [c + Math.cos(a) * radio * f, c + Math.sin(a) * radio * f];
  };
  const contorno = f => valores.map((_, k) => punto(k, f).join(",")).join(" ");

  // el degradado de dentro, de cian a azul, como la figura del juego
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML =
    '<radialGradient id="tela-relleno" cx="50%" cy="45%" r="62%">' +
    '<stop offset="0%" stop-color="#bdfbff" stop-opacity=".95"/>' +
    '<stop offset="60%" stop-color="#3fe0d0" stop-opacity=".75"/>' +
    '<stop offset="100%" stop-color="#1f8fe0" stop-opacity=".62"/>' +
    '</radialGradient>';
  svg.appendChild(defs);

  crea("polygon", {points:contorno(1), fill:"rgba(6,32,72,.45)"});
  for (const f of [0.25, 0.5, 0.75, 1])
    crea("polygon", {points:contorno(f), fill:"none",
                     stroke:"rgba(255,255,255," + (f === 1 ? ".45" : ".18") + ")",
                     "stroke-width":f === 1 ? 1.4 : 1});
  for (let k = 0; k < 7; k++) {
    const [x, y] = punto(k, 1);
    crea("line", {x1:c, y1:c, x2:x, y2:y, stroke:"rgba(255,255,255,.16)"});
  }
  const fs = valores.map(v => Math.max(0.08, Math.min(1, v / tope)));
  crea("polygon", {points:valores.map((_, k) => punto(k, fs[k]).join(",")).join(" "),
                   fill:"url(#tela-relleno)", stroke:"#eafdff", "stroke-width":2,
                   "stroke-linejoin":"round"});
  for (let k = 0; k < 7; k++) {
    const [x, y] = punto(k, fs[k]);
    crea("circle", {cx:x, cy:y, r:2.6, fill:"#ffffff"});
  }
  return svg;
}

function seccionAtributos(d) {
  // Los stats ya los pone pintaFicha a la izquierda, como en el juego; aqui solo
  // va lo que se puede cambiar.
  const fila = d.fila, caja = el("div", {});
  const campos = el("div", {class:"campos"});
  campos.appendChild(numero("Nivel", d.nivel, d.niveles.minimo, d.niveles.maximo,
    v => manda({tipo:"nivel", fila, valor:v})));
  campos.appendChild(d.rarezas.puede
    ? desplegable("Rareza", d.rarezas.opciones.map(o => [o.valor, o.nombre]), d.rareza,
        v => manda({tipo:"rareza", fila, valor:v}))
    : bloqueado("Rareza", d.rareza + " — " + d.rarezas.motivo));
  campos.appendChild(d.arquetipos.length
    ? desplegable("Arquetipo", d.arquetipos.map(o => [o.valor, o.nombre]),
        d.arquetipo, v => manda({tipo:"arquetipo", fila, valor:v}))
    : bloqueado("Arquetipo", d.arquetipo + " — " + (d.arquetipo_motivo || "")));
  campos.appendChild(numero("Partidos jugados", d.partidos, d.partidos_limites.minimo,
    d.partidos_limites.maximo, v => manda({tipo:"partidos", fila, valor:v})));
  caja.appendChild(campos);
  // Jugador, gerente o entrenador. En el juego se hace equipandole la Medalla
  // de gerente o la de entrenador en la tabla de habilidades; quitarsela lo
  // devuelve a jugador (NOTAS O-132).
  if (d.rol) {
    caja.appendChild(el("div", {class:"seccion-nav"}, [el("h4", {text:"Rol en el equipo"})]));
    const r = el("div", {class:"roles"});
    r.appendChild(el("span", {class:"rol-ahora " + d.rol.ahora,
      text:"Ahora es " + d.rol.ahora
        + (d.rol.de_fabrica === d.rol.ahora ? " (de fabrica)" : "")}));
    for (const o of d.rol.opciones)
      r.appendChild(el("button", {class:"btn chico" + (o.puede ? "" : " vetado"),
        text:"Convertir en " + o.valor,
        title:o.puede ? (o.de_fabrica
              ? "Es " + o.valor + " de fabrica, no le hace falta medalla"
              : "Se le pone la Medalla de " + o.valor) : o.motivo,
        onclick:() => { if (!o.puede) { aviso(o.motivo, "mal"); return; }
                        manda({tipo:"rol", fila, valor:o.valor}); }}));
    caja.appendChild(r);
    caja.appendChild(el("p", {class:"pie-seccion", text:
      "Un gerente o un entrenador no pisa el campo ni el banquillo, y un jugador "
      + "normal no se sienta en el cuerpo tecnico. Es lo que hace el juego."}));
  }
  // Pasar a Diamante: en el juego se hace con una semilla Diamante o
  // comprandolo en la tienda, y vale para cualquier jugador normal.
  if (d.rareza_valor < 5)
    caja.appendChild(el("p", {class:"pie-seccion"}, [
      el("button", {class:"btn chico", text:"Convertir en Diamante",
        title:"Como con una semilla Diamante en el juego",
        onclick:async () => { if (await confirma("Convertir en Diamante",
                                  "Se convierte en Diamante. Se puede deshacer."))
                          manda({tipo:"diamante", fila}); }})]));
  // La pasiva personalizada: una por jugador, de las que tengas en la mochila
  // (NOTAS O-179).
  caja.appendChild(el("div", {class:"seccion-nav"}, [el("h4", {text:"Pasiva personalizada"})]));
  const pz = d.personalizada || {};
  const filaPz = el("div", {class:"ranura"}, [
    el("div", {class:"marca", text:"P"}),
    pz.icono200 ? el("img", {class:"mini-icono grande", loading:"lazy", alt:"",
                             src:"/icono/" + pz.icono200}) : null,
    el("div", {class:"texto"}, [el("b", {text:pz.nombre || "ninguna"}),
      el("span", {text:pz.numero ? "Pasiva personalizada " + pz.numero + ", una por jugador"
                                 : "una por jugador, sale de un manual de la mochila"})]),
    el("button", {class:"elegir", text:"Cambiar",
      onclick:() => abrePicker("Pasiva personalizada",
        () => pedir("/api/opciones?tipo=personalizada&fila=" + d.fila)
                .then(r => ({...r, ordenes:[{campo:"etiqueta", etiqueta:"nombre"}],
                  actual:r.puesta || null,
                  opciones:r.opciones.map(o => ({...o, valor:o.id, etiqueta:o.nombre,
                                                 icono200:o.icono200 || ""}))})),
        v => manda({tipo:"personalizada", fila:d.fila, id:v}))}),
    pz.id ? el("button", {class:"btn chico", text:"Quitar",
      onclick:() => manda({tipo:"personalizada", fila:d.fila, id:""})}) : null]);
  caja.appendChild(filaPz);

  // Borrar al jugador de la partida, como desde el menu del juego. Si esta en
  // algun equipo no se puede: hay que sacarlo antes (regla de Aaron).
  caja.appendChild(el("div", {class:"seccion-nav"}, [el("h4", {text:"Borrar"})]));
  const enEquipo = (d.equipos || []).length > 0;
  caja.appendChild(el("p", {class:"pie-seccion"}, [
    el("button", {class:"btn chico rojo" + (enEquipo ? " vetado" : ""),
      text:"Borrar jugador",
      title:enEquipo ? "Esta en el equipo " + d.equipos.join(", ") + ": sacalo primero"
                     : "Se quita de la partida, como desde el menu del juego. Se puede deshacer.",
      onclick:async () => {
        if (enEquipo) { aviso("Esta en el equipo " + d.equipos.join(", ") + ". Sacalo del equipo primero.", "mal"); return; }
        if (await confirma("Borrar jugador", "Se borra a " + d.nombre + " (Nv." + d.nivel + ") de la partida. Se puede deshacer."))
          manda({tipo:"borrar_jugador", fila});
      }}),
    enEquipo ? el("span", {class:"bloqueada", text:"esta en " + d.equipos.join(", ")}) : null]));
  caja.appendChild(el("div", {class:"seccion-nav"}, [el("h4", {text:"Judias"})]));
  const j = el("div", {});
  for (const x of d.judias)
    j.appendChild(x.tope ? filaJudia(fila, x)
                         : ranura(String(x.ranura), x.motivo, null, null, null, true));
  caja.appendChild(j);
  return caja;
}
function seccionTecnicas(d) {
  // El arbol se parte en dos ramas y solo se juega una. Se dice cual, y las de
  // la rama cerrada se ven apagadas: en el juego no las tiene (NOTAS O-111).
  const caja = el("div", {});
  if (d.rama) {
    const r = d.rama;
    const barra = el("div", {class:"barra-rama"});
    barra.appendChild(el("span", {text:"Arbol: " + r.casillas + " casillas ("
      + r.tronco + " tronco, " + (r.rama1 + r.rama2) + " rama, " + r.extra + " extra). "
      + (r.elegida ? "Juega la RAMA " + r.cual + "." : "Aun no ha elegido rama.")}));
    if (r.elegida)
      barra.appendChild(el("button", {class:"btn chico",
        text:"Cambiar a la rama " + (3 - r.cual),
        title:"Es lo mismo que pulsar el nudo del medio del arbol en el juego",
        onclick:() => manda({tipo:"cambiar_rama", fila:d.fila})}));
    caja.appendChild(barra);
  }
  let ultimo = "";
  for (const t of d.tecnicas) {
    if (t.trozo && t.trozo !== ultimo) {
      ultimo = t.trozo;
      caja.appendChild(el("div", {class:"trozo-arbol" + (t.abierta ? " abierto" : "")},
        [el("span", {text:t.trozo === "tronco" ? "TRONCO — las tiene siempre"
              : t.trozo.toUpperCase() + (t.abierta ? " — la que juega" : " — cerrada")})]));
    }
    const fila = t.admite
      ? ranuraTecnica(t,
          () => pedir(`/api/opciones?tipo=tecnica&fila=${d.fila}&ranura=${t.ranura}`)
                  .then(r => ({de_donde:"solo admite tecnicas de " + r.admite,
                    actual_etiqueta:t.puesta || null,
                    facetas:[{campo:"categoria", etiqueta:"Tipo"},
                             {campo:"subtipo", etiqueta:"Clase", nombres:NOMBRE_FAMILIA},
                             {campo:"elemento", etiqueta:"Afinidad"},
                             {campo:"dueno", etiqueta:"De quien es"}],
                    ordenes:[{campo:"poder", etiqueta:"mas poder", mayor:true},
                             {campo:"etiqueta", etiqueta:"nombre"},
                             {campo:"tp", etiqueta:"menos TP"},
                             {campo:"rango", etiqueta:"rango del espiritu", mayor:true}],
                    opciones:r.opciones.map(o => ({...o, valor:o.id, etiqueta:o.nombre,
                      icono:o.icono || ""}))})),
          // se manda el codigo, no el nombre: hay hipertecnicas con el nombre repetido
          v => manda({tipo:"tecnica", fila:d.fila, ranura:t.ranura, id:v}),
          "Tecnica de la ranura " + t.ranura)
      : ranura(String(t.ranura), "no existe en su arbol", null, null, null, true);
    if (t.abierta === false) fila.classList.add("cerrada");
    caja.appendChild(fila);
  }
  return caja;
}

/* Ordenar la equipacion por lo que sube: por nombre, por el total, o por cada
   stat (lo pidio Aaron para encontrar las mejores botas y colgantes rapido). */
const NOMBRES_STAT_CORTO = ["Potencia", "Control", "Tecnica", "Presion", "Fisico", "Agilidad", "Inteligencia"];
const ORDENES_EQUIPO = [{campo:"etiqueta", etiqueta:"nombre"}, {campo:"total", etiqueta:"total que sube", mayor:true}]
  .concat(NOMBRES_STAT_CORTO.map((n, i) => ({campo:"s" + i, etiqueta:"+" + n, mayor:true})));

function seccionEquipacion(d) {
  const caja = el("div", {});

                                             ...Object.fromEntries((o.stats || []).map((v, i) => ["s" + i, v]))}))})),

function seccionPasivas(d) {
  // Cada ranura ensena la suya, y **el boton de heredar esta en la propia
  // ranura**: lo que herede ahi tapa a la de esa ranura. Si ya hay una heredada,
  // se ve con su punto azul, debajo en pequeno la que esta tapando, y un boton
  // para quitarla que devuelve la de siempre.
  const caja = el("div", {});
  const h = d.heredadas;
  // Un gerente o entrenador lleva OTRA lista de pasivas (NOTAS O-163)
  if (d.pasivas_personal) {
    const pp = d.pasivas_personal;
    caja.appendChild(el("div", {class:"seccion-nav"}, [el("h4", {text:"Pasivas como " + pp.rol})]));
    if (pp.lista)
      for (const x of pp.lista)
        caja.appendChild(el("div", {class:"ranura"}, [
          el("div", {class:"marca", text:String(x.ranura)}),
          x.icono200 ? el("img", {class:"ico-pasiva", loading:"lazy", alt:"", src:"/icono/" + x.icono200}) : null,
          el("div", {class:"texto"}, [el("b", {text:x.texto})]),
          // se pueden cambiar: un gerente solo con pasivas de gerente y un
          // entrenador solo con las suyas (NOTAS O-185)
          pp.se_puede_cambiar
            ? el("button", {class:"elegir", text:"Cambiar",
                onclick:() => abrePicker("Pasiva de " + pp.rol + " " + x.ranura,
                  () => pedir("/api/opciones?tipo=personal&fila=" + d.fila)
                          .then(r => ({...r, ordenes:[{campo:"etiqueta", etiqueta:"nombre"}],
                            de_donde:"solo pasivas de " + r.rol,
                            actual:x.id || null,
                            opciones:r.opciones.map(o => ({...o, valor:o.id, etiqueta:o.nombre,
                                                           icono200:o.icono200 || ""}))})),
                  v => manda({tipo:"pasiva_personal", fila:d.fila, ranura:x.ranura, id:v}))})
            : el("span", {class:"bloqueada", text:"las pone el juego"})]));
    else
      caja.appendChild(el("p", {class:"pie-seccion", text:"Como " + pp.rol + " sus pasivas " + pp.motivo + "."}));
    caja.appendChild(el("div", {class:"seccion-nav"}, [el("h4", {text:"Pasivas como jugador"})]));
  }
  d.pasivas.forEach(x => {
    const f = el("div", {class:"ranura" + (x.heredada ? " heredada" : "")});
    f.appendChild(el("div", {class:"marca", text:String(x.ranura)}));
    // el dibujo del juego para lo que hace la pasiva (NOTAS O-141)
    if (x.icono200) f.appendChild(el("img", {class:"ico-pasiva", loading:"lazy", alt:"",
                                            src:"/icono/" + x.icono200}));
    const texto = el("div", {class:"texto"});
    const linea = el("b");
    if (x.heredada) linea.appendChild(el("i", {class:"punto-azul"}));
    linea.appendChild(document.createTextNode(x.heredada || x.normal || "vacia"));
    texto.appendChild(linea);
    if (x.heredada)
      texto.appendChild(el("span", {class:"tapada",
        text:"heredada, tapa a: " + (x.normal || "vacia")}));
    f.appendChild(texto);

    if (d.pasivas_bloqueadas)
      f.appendChild(el("span", {class:"bloqueada", text:d.motivo_pasivas || "fijas"}));
    else
      f.appendChild(el("button", {class:"elegir", text:"Cambiar",
        onclick:() => abrePicker("Pasiva " + x.ranura,
          () => pedir(`/api/opciones?tipo=pasiva&fila=${d.fila}&ranura=${x.ranura}`)
                  .then(r => ({...r, ordenes:[{campo:"etiqueta", etiqueta:"nombre"}],
                    actual_etiqueta:x.normal || null,
                    opciones:r.opciones.map(o => ({...o, valor:o.id, etiqueta:o.nombre,
                                                   icono200:o.icono200 || ""}))})),
          v => manda({tipo:"pasiva", fila:d.fila, ranura:x.ranura, id:v}))}));

    if (x.heredada)
      f.appendChild(el("button", {class:"elegir quitar", text:"Quitar herencia",
        title:"Vuelve a verse " + (x.normal || "la ranura vacia"),
        onclick:() => manda({tipo:"quitar_heredada", fila:d.fila, ranura:x.ranura})}));
    else if (h.puede)
      f.appendChild(el("button", {class:"elegir heredar", text:"Heredar aqui",
        title:"Tapa la pasiva de esta ranura con una heredada",
        onclick:() => abrePicker("Heredar en la ranura " + x.ranura,
          () => pedir("/api/opciones?tipo=heredada&fila=" + d.fila)
                  .then(r => ({...r, ordenes:[{campo:"etiqueta", etiqueta:"nombre"}],
                    actual_etiqueta:x.heredada || null,
                    opciones:r.opciones.map(o => ({...o, valor:o.id, etiqueta:o.nombre,
                                                   icono200:o.icono200 || ""}))})),
          v => manda({tipo:"heredada", fila:d.fila, ranura:x.ranura, id:v}))}));
    else
      f.appendChild(el("span", {class:"bloqueada", text:h.motivo || "—"}));
    caja.appendChild(f);
  });
  caja.appendChild(el("p", {class:"pie-seccion", text: h.puede
    ? "Puedes heredar " + h.libres + " pasivas mas. La heredada tapa a la de su "
      + "ranura; al quitarla vuelve la de siempre."
    : h.motivo}));
  return caja;
}

function ranura(marca, actual, nota, cargar, alElegir, inerte, titulo, dibujo) {
  // `marca` es lo que va en el rombo (el numero de ranura) y `titulo` lo que se
  // lee arriba de la ventana de elegir. Sin titulo la ventana se llamaba "1",
  // que no dice nada. `dibujo` es la imagen de lo que hay puesto, si la hay.
  return el("div", {class:"ranura"}, [
    el("div", {class:"marca", text:marca}),
    dibujo || null,
    el("div", {class:"texto"}, [el("b", {text:actual}),
      nota ? el("span", {text:nota}) : null]),
    inerte ? el("span", {class:"bloqueada", text:"—"})
      : el("button", {class:"elegir", text:"Cambiar",
          onclick:() => abrePicker(titulo || marca, cargar, alElegir)})]);
}

/* Una ranura del arbol de habilidades, con la barra de color del juego. */
function ranuraTecnica(t, cargar, alElegir, titulo) {
  const caja = el("div", {class:"ranura ranura-tec"});
  caja.appendChild(el("div", {class:"marca", text:String(t.ranura)}));
  if (t.puesta) {
    const barra = el("div", {class:"tec-barra"});
    barra.style.background = fondoBarra(t.elemento, t.tipo);
    const ico = t.icono
      ? el("img", {class:"ico-tipo", loading:"lazy", alt:"", src:"/espiritu/" + t.icono})
      : iconoTipo(t.tipo);
    if (ico) barra.appendChild(ico);
    barra.appendChild(el("span", {class:"nom", text:t.puesta}));
    if (t.tp) barra.appendChild(el("span", {class:"tp", text:"TP " + t.tp}));
    if (t.poder) {
      barra.appendChild(el("span", {class:"clase",
        text:t.tipo === "Parada" || t.tipo === "Defensa" ? "DF" : "AT"}));
      barra.appendChild(el("span", {class:"pot", text:String(t.poder)}));
    }
    caja.appendChild(barra);
  } else {
    caja.appendChild(el("div", {class:"texto"}, [el("b", {text:"vacia"}),
      el("span", {text:"solo " + t.admite})]));
  }
  if (t.puesta && t.icono)      // es un espiritu: se puede ver su ficha (O-184)
    caja.appendChild(el("button", {class:"info", text:"i", title:"Ver la pasiva de este espiritu",
      onclick:() => fichaEspiritu(t.id)}));
  caja.appendChild(el("button", {class:"elegir", text:"Cambiar",
    onclick:() => abrePicker(titulo, cargar, alElegir)}));
  return caja;
}

/* La ficha de un espiritu: su habilidad pasiva, su supertecnica y de quien es.
   Aaron la pidio como "el tipico boton de informacion" (NOTAS O-184). */
async function fichaEspiritu(id) {
  let d;
  try { d = await pedir("/api/espiritu/" + id); }
  catch (e) { aviso(e.message, "mal"); return; }
  const caja = el("div", {class:"modal ficha-esp"});
  caja.appendChild(el("div", {class:"cab"}, [
    el("h3", {text:d.nombre_largo || d.nombre || id}),
    el("p", {text:[NOMBRE_FAMILIA[d.familia] || d.familia || "",
                   d.rango ? "\u2605".repeat(d.rango) : "", d.dueno || ""]
                  .filter(Boolean).join("   ")})]));
  const cuerpo = el("div", {class:"cuerpo"});
  if (d.icono) cuerpo.appendChild(el("img", {class:"retrato-esp", loading:"lazy", alt:"",
                                             src:"/espiritu/" + d.icono}));
  const texto = el("div", {class:"datos"});
  if (d.pasiva) {
    texto.appendChild(el("div", {class:"sub", text:"Habilidad pasiva"}));
    texto.appendChild(el("p", {class:"pasiva-esp grande", text:d.pasiva}));
  } else {
    texto.appendChild(el("p", {class:"vacio", text:"De este no se sabe la pasiva."}));
  }
  if (d.tecnica) {
    texto.appendChild(el("div", {class:"sub", text:"Supertecnica del espiritu"}));
    texto.appendChild(barraDeTecnica({etiqueta:d.tecnica, elemento:d.tecnica_elemento,
      categoria:d.tecnica_categoria, tp:d.tecnica_tp, poder:d.tecnica_poder}));
  }
  if (d.descripcion) texto.appendChild(el("p", {class:"desc", text:d.descripcion}));
  cuerpo.appendChild(texto);
  caja.appendChild(cuerpo);
  const pie = el("div", {class:"pie"});
  const fondo = el("div", {class:"fondo-modal", onclick:e => { if (e.target === fondo) cerrar(); }}, [caja]);
  function cerrar() { fondo.remove(); document.onkeydown = antes; }
  pie.appendChild(el("button", {class:"btn", text:"Cerrar", onclick:cerrar}));
  caja.appendChild(pie);
  const antes = document.onkeydown;
  document.onkeydown = e => { if (e.key === "Escape") cerrar(); };
  document.body.appendChild(fondo);
}
function filaJudia(fila, j) {

    el("div", {class:"texto"}, [el("b", {text:j.tipo || "vacia"}),
      el("span", {text:"tope " + j.tope})]),
    el("div", {style:"display:flex;gap:6px;align-items:center"}, [num,
