<!-- la pagina es una 3DS (O-316): sin la cabecera de Pizarra; "‹ Inicio" fuera de la consola -->

<main class="gx-pagina">
  <div class="gx-sitio" id="sitio">
    <!-- las dos pantallas (partido-consola.js): arriba 400x240 u y abajo 320x240 u, con un
         canvas 2D encima y una capa HTML con zoom; detras, un solo WebGL (E2) -->

      <canvas id="gl"></canvas>
      <div class="gx-pantalla" id="arriba">
        <canvas class="gx-hud" id="arriba-hud"></canvas>
        <div class="gx-dom" id="arriba-dom"><div class="gx-aviso-3d" id="aviso-3d" hidden></div>

          <div class="gx-espera-vr" id="espera-vr" hidden><i></i>Cargando la animación</div></div>
      </div>
      <div class="gx-pantalla" id="abajo">
        <!-- E1: el campo 2D de hoy (E2 pone el 3D) -->
        <canvas id="campo"></canvas>
        <canvas class="gx-hud" id="abajo-hud"></canvas>
        <div class="gx-dom" id="abajo-dom">
          <!-- elegir equipos y opciones como Galaxy (diseno 3): las filas leen y cambian los
               <select> de siempre, que siguen ocultos abajo -->
          <section class="gx-elegir pantalla" id="pantalla-elegir">
            <div class="gx-pestanas" id="pestanas">
              <button class="gx-pestana activa" data-pestana="partido">Partido</button>
              <button class="gx-pestana" data-pestana="pantalla">Pantalla</button>
            </div>
            <div class="gx-filas" id="filas-partido"></div>

              <div class="titulo">Online <span class="estado-red" id="estado-red">sin conectar</span></div>

                <button class="gx-boton chico" id="entrar">Entrar</button></div>
              <p class="nota">Juegas con <b id="online-equipo">tu equipo</b>. Invita a un amigo que tenga Pizarra abierto en Partido.</p>
              <div id="invitaciones" class="gente"></div>

<!-- las opciones de siempre: el modelo de datos de la pantalla de elegir (diseno 3). Las

  <select id="equipo-b"></select>

  <!-- que pasa si hay empate al final, como las reglas de GO Light (O-312) -->

    <option value="nada">Nada</option>
    <option value="prorroga">Prórroga</option>
    <option value="penaltis">Penaltis</option>
    <option value="prorroga-penaltis">Prórroga y penaltis</option>
  </select>
  <input type="checkbox" id="focos-auto" title="La máquina elige por ti en los focos y disputas (regates y entradas); en los tiros y paradas sigues eligiendo tú">
  <input type="checkbox" id="fuera-juego" checked title="Pasar a un compañero que está por delante del penúltimo rival es fuera de juego">
  <input type="checkbox" id="sonido" checked title="Silbato, patadas, duelos y el público en los goles">
  <!-- las de la pestana Pantalla (O-316): solo en este PC, no viajan online -->

    <option value="cortas">Cortas</option>
  </select>
  <input type="checkbox" id="opcion-3d" checked title="Se juega en el campo en 3D con los modelos de tu juego, de cerca y siguiendo al balón; si lo quitas, el campo plano (para ordenadores sin 3D)">
  <select id="pantallas" title="Las dos pantallas una encima de otra, como la 3DS, o una al lado de otra (más grandes)">
    <option value="encima">Como la 3DS</option>

  </select>

    <option value="auto">Automática</option>

    <option value="media">Media</option>
    <option value="baja">Baja</option>
  </select>
  <input type="checkbox" id="opcion-fps" title="Un contador pequeño abajo a la derecha con las imágenes por segundo, lo que tarda cada una y la calidad">

<!-- "Cómo se juega": se lee en la tactil, al elegir y en Registro (O-316, O-318; al dia en O-321) -->
<template id="ayuda">
    Se juega en la <b>pantalla de abajo</b>, como la táctil de la 3DS. A la derecha, con el juego en marcha, la columna de <b>iconos</b>: la <b>mano</b> es la pausa, <b>TS</b> las tácticas, el <b>aura</b> los espíritus (el número dice cuántos puedes invocar ahora; al pulsarla <b>se para el juego</b> para invocar) y la <b>T</b> el <b>tiro largo</b>: si el que lleva el balón tiene una supertécnica de tiro largo (y tensión para ella), chuta con ella desde lejos y va como un tiro normal; si no, la T es un <b>pase hacia delante</b> (al compañero mejor colocado por delante o, si no hay, al hueco). Debajo de la T pone lo que hará y, con el ratón encima, se ve adónde va. La ficha grande de un jugador sale en <b>Equipo</b>. Apagados (rellenos de verde oscuro) es que ahora no: al pulsarlos te dicen por qué. Las tácticas salen en un panel abajo que <b>no para el juego</b>.<br>
    <b>Arrastra</b> desde tu jugador para dibujar por dónde corre.<br>
    <b>Pulsa a un compañero</b> para pasarle; <b>pulsa un punto</b> para el pase al hueco; <b>mantén pulsado</b> para un <b>pase bombeado</b> (no se corta).<br>
    <b>Pulsa la portería rival</b> para chutar, en el sitio al que quieres tirar: el tiro va ahí (la <b>X</b>). Se chuta desde el área o un poco fuera de ella, por delante o por los lados (con un tiro largo a punto, desde mucho más lejos); al acercarte ya ves el cono y la X. Si pulsas la portería mientras va un pase, <b>remata de primeras</b>.<br>
    <b>Pulsa al rival con balón</b>: tus dos más cerca van a presionarle.<br>
    Abajo ves el campo de cerca, siguiendo al balón: las <b>flechas del teclado</b> mueven la cámara (con Mayúsculas, más rápido); con el balón en juego vuelve sola al balón al soltarlas y, con el juego parado (pausa, saques, duelos), se queda donde la dejes y también puedes <b>arrastrar el campo</b> desde un sitio vacío. Los triángulos amarillos de los bordes señalan a los jugadores que no se ven.<br>
    Cuando llevas el balón, sobre tus compañeros libres (sin rival cerca y con el pase limpio) sale <b>«¡Aquí!»</b>.<br>
    El partido dura <b>2 × 15</b> o <b>2 × 30 minutos</b> del reloj, como en 3DS (una parte de 15 son unos 75 s de juego corriendo). Si a las 15:00 el balón está en juego, la parte sigue hasta que se pare, como mucho hasta las 17:00.<br>
    <b>Antes de cada saque</b> (de centro, banda, córner, puerta, falta y penalti) el juego espera con todos colocados: <b>coloca a tus jugadores</b> arrastrándolos donde quieras (se ponen ahí; no es una ruta), menos muy cerca del balón, como en la vida real (los rivales del que saca: a 2 m en el saque de banda y a 9,15 m en la falta, el córner y el de centro; en el saque de puerta, fuera del área; en el penalti, nadie en el área ni en el semicírculo; en el de centro, cada uno en su campo), y pulsa <b>Jugar</b> (o barra espaciadora); en <b>Menú</b> están Registro, Equipo (los cambios) y Táctica. Tras pulsar Jugar ya no se coloca: <b>nadie se mueve hasta que se saca</b> (ni los rivales); dibuja las carreras de los tuyos y, si sacas tú, saca pulsando a un compañero, un sitio o la portería (la máquina saca tras un momento). Al sacar echan a correr, cada uno por su carrera si la tiene, y los colocados sin carrera se quedan en su sitio hasta que alguien coge el balón. Online sigue cuando pulsáis los dos.<br>
    <b>Pausa</b> (la mano, o la barra espaciadora), cuando quieras y sin límite, con <b>Registro</b> (lo que pasa y esta ayuda), <b>Equipo</b>, <b>Táctica</b> y <b>Seguir</b>: con todo parado dibujas rutas a varios y marcas el pase o el tiro, que salen al seguir; si al que le pasas le has dibujado una carrera, le llega en carrera. Para quitar el pase marcado, pulsa otra vez al compañero o el sitio al que va (o al que lleva el balón): se ve en rojo y se apaga. Pulsar otra vez la portería cambia adónde va el tiro marcado. Sigue al pulsar <b>Seguir</b> (online, los dos).<br>
    <b>Cambios</b> (5 por partido y uno más si hay prórroga): en la pausa, en la espera del saque o en el descanso, en <b>Equipo</b>: pulsa a uno del campo, a uno del banquillo y <b>Cambiar</b>. Los que eliges en la pausa entran cuando se pare el balón (fuera, falta, gol...), como en la vida real; hasta entonces los puedes quitar. Como en Victory Road, el que entra tiene <b>AT y DF +15 %</b> durante 60 s de juego y los de su misma posición +5 %, y cada cambio suma <b>30 s de descuento</b> a la parte (los del descanso, no). El que sale ya no vuelve y al expulsado no se le puede cambiar.<br>
    En el descanso, la segunda parte empieza al pulsar <b>Segunda parte</b> (online, cuando pulséis los dos), sin límite de tiempo. En el descanso y al final, abajo salen las <b>estadísticas</b>: tiros, supertécnicas, posesión, las tarjetas si las hay y los goles con su minuto.<br>
    <b>Si hay empate</b> al final, lo que elegiste al empezar: nada, <b>prórroga</b> (dos partes de 5 minutos, o de 10 en partes de 30, con su descanso, cambio de campo en cada una y un cambio más; sin gol de oro), <b>penaltis</b> o las dos cosas. En la <b>tanda de penaltis</b>, todos a la misma portería (la sortea el árbitro y la ves arriba en tu pantalla), tiran 5 cada uno por turnos (los de más tiro primero y el portero el último), se acaba antes si uno ya no puede alcanzar al otro y, si siguen empatados, muerte súbita. En cada penalti (también el de una falta en el área) el que tira y el portero eligen a la vez una <b>zona</b> (izquierda, centro o derecha, como la ves en tu pantalla) y, si quieren, una supertécnica: si el portero se tira a otro lado es gol; si acierta, gana el número mayor. En la tanda el reloj está parado: una invocación vale solo para ese penalti.<br>
    En cada <b>duelo</b> el partido se para: eliges abajo, en la barra de tres botones (el de la izquierda, el de la derecha o el <b>rayo</b>: tus supertécnicas; marca una y <b>¡Aceptar!</b>) y, mientras, puedes dibujar rutas. Arriba ves el <b>poder de base</b> de los dos (con los compañeros que apoyan) y en cada botón el <b>total</b> con el que quedarías. Gana el <b>número más alto</b>; a veces hay un <b>¡Crítico!</b> y gana el otro (1 de cada 10 si los números son parecidos, menos cuanto más lejos, y nunca si uno triplica al otro). Los comandos fuertes ganan más, pero <b>Entrada</b> y <b>Cargar</b> pueden ser falta (en el área, penalti). Con <b>Focos automáticos</b> (al elegir el partido) la máquina elige por ti en los regates y las entradas; en los tiros y las paradas sigues eligiendo tú.<br>
    En algunas faltas el árbitro saca <b>tarjeta</b>, pocas veces: <b>amarilla</b> en 1 de cada 5 (1 de cada 3 si fue con Entrada o en el área) y, muy rara vez, <b>roja</b> directa. Dos amarillas son roja. El <b>expulsado</b> sale del campo, su equipo juega con uno menos y no se le puede cambiar (si era el portero, se pone de portero el que mejor para). No se expulsa a nadie de un equipo que ya juega con 7. No hay ley de la ventaja: la falta se pita siempre.<br>
    Al chutar, como en Galaxy, <b>el que chuta elige su tiro y chuta</b>: <b>Tirar</b> o <b>Vaselina</b> (×0,8, pero pasa por encima de los defensas que no están pegados a ti, y no se encadena), o una supertécnica; rematando de primeras un <b>pase bombeado</b>, <b>Testarazo</b> o <b>Volea</b> (cuenta el Físico; la volea es fuerte pero inestable). Luego <b>el balón viaja</b> hacia la portería y el juego sigue: mientras va, dibuja flechas para llevar a los tuyos a su camino. Si le llega a un <b>defensa</b>, se para y ese elige su <b>bloqueo</b> (o dejarlo pasar): si gana, lo para y <b>se queda el balón</b>; si pierde, le quita al tiro su número entero, como en Victory Road (y a veces lo desvía a córner; si el tiro le gana por crítico, lo atraviesa sin perder nada), y el balón sigue hasta el siguiente. Si le llega a un <b>compañero</b> del que chuta con un tiro de cadena, puede <b>encadenarlo</b> (se suman y el gol sería suyo). Al llegar a la portería elige el <b>portero</b>: <b>Parar</b> (se la queda), <b>Despejar</b> (×1,25, pero el balón rebota a cualquier sitio y puede acabar en córner) o su supertécnica. El tiro <b>va adonde apuntaste</b> y, mientras eliges tu tiro, puedes pulsar dentro de la portería para afinar (la X se mueve). Solo se va fuera si apuntas muy fuera de la portería (la X sale en rojo): saque de puerta; pulsando un poco fuera va pegado al palo por dentro.<br>
    Los <b>números son los de Victory Road</b> (los de la calculadora): el tiro, Potencia + Control más su supertécnica, con las pasivas (también las del <b>entrenador</b> y los <b>gerentes</b>); desde lejos pierde un poco (hasta un 10 % a 35 m; el tiro largo, nada). El <b>portero</b> tiene su <b>PP</b> de Victory Road (4 × Agilidad + 3 × Físico + 2 × Presión, con las pasivas de PP) y es una barra que <b>se gasta</b>: el tiro es gol si pasa de lo que le queda más su supertécnica; si no, lo para y el PP le baja lo que el tiro pasa de su supertécnica. No se recupera con el tiempo: solo al invocar su espíritu (+15 % de su máximo, que se queda) y se llena en el descanso. Cada parada le cansa: −5 % a su supertécnica de parada (hasta 5 veces). Así un portero fresco para casi todo y se marca al segundo o tercer tiro. Los <b>elementos</b>: +20 % si el elemento del jugador gana al del rival y otro +20 % si su supertécnica gana a la supertécnica del rival (los dos con una); en el portero, solo en su supertécnica. En el remate de primeras sin supertécnica (<b>tiro directo</b>) se suma la mitad del tiro del que pasa.<br>
    Como en Victory Road, cada <b>pase</b> completado sube el <b>poder de afinidad</b> del equipo (+1 %, hasta 30 %; sin el balón baja 2 % por segundo) y ganar un duelo con supertécnica sube el <b>combo</b> (hasta 3): el siguiente tiro suma la afinidad y +10/15/20 % del combo, y con combo las supertécnicas cuestan la mitad o un cuarto de tensión; se gastan al chutar (el combo se pierde si el rival coge el balón). Y la <b>configuración</b> del equipo (la que más se repite en sus pasivas) tiene su <b>carga</b>, del rango 1 al 5: <b>Justicia</b> sube un rango cada 25 s de juego sin falta (−3 por falta) y da PP +5 % por rango desde el 2; <b>Contraataque</b> sube al robar el balón (+4 en tu campo, +2 en el rival) y baja con el tiempo. Las pasivas «Por cada rango de Conf. …» valen eso por el rango. La ficha de arriba lo dice.<br>
    El balón <b>sale del campo</b> como en un partido de verdad: los pases no son perfectos (fallan más cuanto más largos, si son bombeados o con un rival encima), los defensas despejan de cabeza los balones bombeados cerca de su área, el portero que despeja la manda a veces a córner y a veces el balón se escapa de un duelo. Así hay saques de banda, córners y saques de puerta.<br>
    Si llevas el balón en un duelo, puedes <b>marcar ya el pase o el tiro</b> como en la pausa: sale si ganas el duelo y se borra si lo pierdes.<br>
    La <b>tensión</b> del equipo (empieza en 105 de 300) paga las supertécnicas (lo que cuestan en Victory Road). Sube al ganar un duelo sin supertécnica (+60), al perder un foco (+30, también con supertécnica) y con un fuera de juego a tu favor (+10); no sube sola.<br>
    La <b>hiperbarra</b> del equipo (de 0 a 200, empieza en 40) se llena usando supertécnicas: lo que cuestan ×0,4 un tiro, ×0,6 un regate, ×0,8 una defensa y ×1 una parada. Con 100, a un jugador con <b>espíritu</b> lo puedes <b>invocar</b>: el <b>aura</b> de la columna <b>para el juego</b> (el <b>tiempo de invocación</b>, como en Galaxy) y abajo sale el panel de los espíritus: eliges a quién e <b>Invocar</b>, o <b>Seguir</b> sin invocar. En esa parada <b>los dos</b> podéis invocar (también la máquina, y también si la pide el rival), <b>uno cada uno</b>; el juego sigue cuando habéis elegido los dos. El aura vuelve a los <b>20 s</b> de juego (para los dos). También se invoca en la pausa y en la espera del saque (<b>Táctica</b> &gt; Espíritus). Arriba se ve cómo sale su espíritu. Mientras dura (keshin y miximax 45 s, tótem 60 s, despertar 30 s, modo 75 s...) es más fuerte, corre más y puede usar su supertécnica ★. Como en Victory Road, con un <b>modo</b> se convierte en su forma, otro personaje entero (Thaddeus Bellefax en <b>Byron Love</b>: su modelo, su elemento, sus stats y sus supertécnicas) y al acabar vuelve; con la <b>armadura</b> o el <b>mixi max</b> cambia su modelo, y el <b>keshin</b> o el <b>tótem</b> sale detrás de él. Como mucho <b>3 a la vez</b> por equipo y 15 s entre una invocación y otra del mismo equipo.<br>
    En un <b>duelo</b>, la franja morada de arriba (<b>★ Usar</b>) saca su hipertécnica: <b>gana siempre</b>, aunque el rival use una supertécnica, salvo que el rival saque también la suya (entonces gana el número mayor y el que pierde no la paga). Al chutar o al parar, <b>Invocar</b> en la franja morada sube tus números, pero no gana solo.<br>
    Las <b>tácticas</b> se lanzan con el juego en marcha (<b>TS</b>), en la pausa o en la espera del saque (<b>Táctica</b>) (las que quitan el balón o aturden, solo con el balón en juego).<br>
    Al resolverse un duelo sale su <b>animación</b>, como en Galaxy: arriba, en 3D con los modelos de tu juego, los dos frente a frente, la supertécnica con su nombre y su elemento, el tiro contra el portero, y las cifras rodando hasta fijarse (la que gana en amarillo); abajo el balón volando, «¡Bloqueo!»... Solo sale la animación del que gana: si los dos usan supertécnica, antes chocan sus nombres arriba y se queda el del que gana; si un regate, un robo, un bloqueo o una parada normales ganan a una supertécnica, se ve esa jugada con «¡Fallo!» sobre la supertécnica que pierde; y si gana una supertécnica a uno que no la usa, sale directamente. El partido sigue al acabar. Al elegir el partido las pones <b>Completas</b> o <b>Cortas</b> (online valen las del que invita). Antes del primer saque sale <b>Preparando el partido</b>: tu Pizarra convierte desde tu juego los modelos y las animaciones de Victory Road de los dos equipos (con el banquillo; solo la primera vez, y tarda unos minutos: empieza en cuanto eliges los equipos) y los carga, para que todas las supertécnicas salgan con la suya. Online empezáis cuando estáis listos los dos. Si alguna aún no está lista al llegar su momento, la animación espera un instante («Cargando la animación»). Tras un <b>gol</b>, abajo se ve su repetición y luego <b>Repetir</b> (otra vez) o <b>Reanudar partido</b>.<br>
    <b>Online</b>, si el otro tarda en elegir o en pulsar Jugar, abajo sale «Espera unos instantes...»; si lleva un minuto sin responder, puedes esperarle o <b>Dejar el partido</b> (también en Registro).<br>
    <b>Arriba</b>, como en la pantalla de arriba de la 3DS, ves el marcador, el reloj, el campo entero con todos los jugadores, los goles y la ficha del jugador que eliges (o del que lleva el balón). Juegas en la pantalla de abajo.<br>
    En la pestaña <b>Pantalla</b>, al elegir el partido: las <b>pantallas</b> una encima de otra como la 3DS o una al lado de otra (más grandes; si salen pequeñas, maximiza la ventana); la <b>Calidad 3D</b> (con Automática baja sola si el ordenador no llega a mover el 3D con soltura); <b>Ver FPS</b>, un contador pequeño abajo a la derecha con las imágenes por segundo, lo que tarda cada una y la calidad que ha puesto; y <b>Campo en 3D</b> (si lo quitas, el campo plano, para ordenadores sin 3D).
