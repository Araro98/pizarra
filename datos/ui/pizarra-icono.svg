<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icono de Pizarra: la ficha hexagonal azul marino del menu (borde blanco y
       aro celeste), y dentro la pizarra tactica del entrenador con el balon. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4886"/>
      <stop offset="1" stop-color="#1b2f5c"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4edf8"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.3" y1="0.2" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdcea"/>
    </linearGradient>
    <clipPath id="ballclip"><circle cx="720" cy="700" r="118"/></clipPath>
  </defs>

  <!-- aro celeste + borde blanco + ficha -->
  <polygon points="512,42 930,283 930,741 512,982 94,741 94,283" fill="#9fb6d6"/>
  <polygon points="512,78 898,302 898,722 512,946 126,722 126,302" fill="#ffffff"/>
  <polygon points="512,112 866,320 866,704 512,912 158,704 158,320" fill="url(#tile)"/>
  <!-- brillo arriba -->
  <polygon points="512,112 866,320 866,340 512,132 158,340 158,320" fill="#ffffff" opacity="0.18"/>

  <!-- la pizarra, inclinada como las fichas del menu -->
  <g transform="translate(512 500) skewX(-8) translate(-512 -500)">
    <rect x="262" y="290" width="500" height="380" rx="26" fill="#0f1f42" opacity="0.55" transform="translate(14 18)"/>
    <rect x="262" y="290" width="500" height="380" rx="26" fill="url(#board)" stroke="#ffffff" stroke-width="14"/>
    <!-- campo dibujado con tiza -->
    <g fill="none" stroke="#9fb6d6" stroke-width="9" stroke-linecap="round">
      <rect x="302" y="330" width="420" height="300" rx="10"/>
      <line x1="512" y1="330" x2="512" y2="630"/>
      <circle cx="512" cy="480" r="62"/>
      <rect x="302" y="410" width="70" height="140"/>
      <rect x="652" y="410" width="70" height="140"/>
    </g>
    <!-- las marcas: equis azules y circulos naranjas -->
    <g stroke="#1b2f5c" stroke-width="20" stroke-linecap="round" fill="none">
      <path d="M352 372 l44 44 M396 372 l-44 44"/>
      <path d="M352 560 l44 44 M396 560 l-44 44"/>
      <path d="M440 462 l44 44 M484 462 l-44 44"/>
    </g>
    <g stroke="#f08a1c" stroke-width="20" fill="none">
      <circle cx="610" cy="400" r="26"/>
      <circle cx="668" cy="480" r="26"/>
      <circle cx="610" cy="574" r="26"/>
    </g>
    <!-- la flecha de la jugada, en cian -->
    <path d="M372 600 C 430 520, 470 420, 560 430 S 640 520, 690 386" fill="none" stroke="#3fe0d0" stroke-width="22" stroke-linecap="round"/>
    <polygon points="690,352 726,412 660,414" fill="#3fe0d0"/>
  </g>

  <!-- el balon, delante, abajo a la derecha -->
  <circle cx="720" cy="700" r="132" fill="#1b2f5c"/>
  <circle cx="720" cy="700" r="118" fill="url(#ball)"/>
  <g clip-path="url(#ballclip)" fill="#1b2f5c">
    <polygon points="720,660 758,688 744,732 696,732 682,688"/>
    <polygon points="741,579 754,619 720,644 686,619 699,579"/>
    <polygon points="842,683 807,708 773,683 786,642 829,642"/>
    <polygon points="774,810 740,786 753,745 795,745 808,786"/>
    <polygon points="632,786 645,745 687,745 700,786 666,810"/>
    <polygon points="611,642 654,642 667,683 633,708 598,683"/>
  </g>
  <g clip-path="url(#ballclip)" fill="none" stroke="#1b2f5c" stroke-width="9" stroke-linecap="round">
    <line x1="720" y1="660" x2="720" y2="642"/>
    <line x1="758" y1="688" x2="775" y2="682"/>
    <line x1="744" y1="732" x2="754" y2="747"/>
    <line x1="696" y1="732" x2="686" y2="747"/>
    <line x1="682" y1="688" x2="665" y2="682"/>
  </g>
  <circle cx="680" cy="656" r="34" fill="#ffffff" opacity="0.55"/>
</svg>
